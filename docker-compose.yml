version: '3.8'

services:
  webserver:
    image: php:7.4-apache
    container_name: test-system-web
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      - database
    environment:
      - MYSQL_HOST=database
      - MYSQL_DATABASE=test_system
      - MYSQL_USER=root
      - MYSQL_PASSWORD=root
    command: >
      sh -c "docker-php-ext-install pdo pdo_mysql && 
             a2enmod rewrite && 
             apache2-foreground"

  database:
    image: mysql:5.7
    container_name: test-system-db
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=test_system
      - MYSQL_USER=test_user
      - MYSQL_PASSWORD=test_password
    volumes:
      - db_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  db_data: